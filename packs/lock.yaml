homeassistant:
  customize:
    automation.auto_lock:
      icon: mdi:lock
      friendly_name: auto lock
    automation.disable_continuous_mode:
      icon: mdi:autorenew-off
      friendly_name: continuous off
    automation.skip_lock_update:
      icon: mdi:lock-check
      friendly_name: skip update

mqtt:
  lock:
    - name: door
      state_topic: nuki/lock/state
      command_topic: nuki/lock/action
      availability_topic: nuki/maintenance/mqttConnectionState
      payload_lock: lock
      payload_unlock: unlock
      payload_open: unlatch
      state_locked: locked
      state_unlocked: unlocked
      payload_available: online
      payload_not_available: offline

    - name: building
      state_topic: nuki/opener/state
      command_topic: nuki/opener/action
      availability_topic: nuki/maintenance/mqttConnectionState
      payload_lock: deactivateRTO
      payload_unlock: activateRTO
      payload_open: electricStrikeActuation
      state_locked: locked
      state_unlocked: unlocked
      value_template: >-
        {%- if value in [ 'RTOactive', 'open', 'opening', 'ContinuousMode' ] -%}
          unlocked
        {%- elif value in [ 'ring', 'uncalibrated' ] -%}
          {{ states('lock.building') }}
        {%- else -%}
          locked
        {%- endif-%}
      payload_available: online
      payload_not_available: offline

  sensor:
    - name: lock
      unique_id: batt_lock
      state_topic: nuki/lock/battery/level
      device_class: battery
      unit_of_measurement: '%'

    - name: current
      unique_id: batt_max_current
      state_topic: nuki/lock/battery/maxTurnCurrent
      device_class: current
      unit_of_measurement: A

    - name: drain
      unique_id: batt_drain
      state_topic: nuki/lock/battery/drain
      device_class: power
      unit_of_measurement: mW

  binary_sensor:
    - name: lock
      unique_id: batt_lock_critical
      state_topic: nuki/lock/battery/critical
      device_class: battery
      icon: mdi:battery-alert-bluetooth
      payload_on: '1'
      payload_off: '0'

    - name: building
      unique_id: batt_building_critical
      state_topic: nuki/opener/battery/critical
      device_class: battery
      icon: mdi:battery-alert-bluetooth
      payload_on: '1'
      payload_off: '0'

    - name: ring
      unique_id: building_ring
      state_topic: nuki/opener/ring
      icon: mdi:bell-ring-outline
      value_template: >-
        {{ 'standby' not in value }}
      payload_on: true
      payload_off: false

input_boolean:
  auto_lock:
    name: door relock
    icon: mdi:door-closed-lock

  away_skip:
    name: away skip
    icon: mdi:lock-minus

  lock_skip:
    name: lock skip
    icon: mdi:lock-off

script:
  doors_full_lock:
    alias: lock
    icon: mdi:key-plus
    sequence:
      - action: lock.lock
        target:
          entity_id: lock.building
      - delay:
          milliseconds: 500
      - action: mqtt.publish
        data:
          topic: nuki/lock/action
          payload: fullLock

  doors_full_unlock:
    alias: unlock
    icon: mdi:key-minus
    sequence:
      - action: lock.unlock
        target:
          entity_id:
            - lock.building
            - lock.door
      - delay:
          milliseconds: 500

  door_building_open:
    alias: open
    icon: mdi:dialpad
    sequence:
      - action: lock.open
        target:
          entity_id: lock.building
      - delay:
          milliseconds: 500

  reboot_nuki_hub:
    alias: reboot
    icon: mdi:lock-reset
    sequence:
      - action: mqtt.publish
        data:
          topic: nuki/maintenance/reset
          payload: 1
      - delay:
          milliseconds: 500

automation:
  - alias: auto_lock
    id: auto_lock
    trace:
      stored_traces: 20
    triggers:
      - trigger: state
        entity_id: binary_sensor.door
        from: 'on'
        to: 'off'
        id: lock_on_door
        for:
          seconds: 30

      - trigger: state
        entity_id: lock.building
        to: locked
        for:
          minutes: 1
        id: lock_on_building

      - trigger: zone
        entity_id: device_tracker.root
        zone: zone.home
        event: enter
        id: lock_off

      - trigger: zone
        entity_id: device_tracker.root
        zone: zone.home
        event: leave
        id: lock_on

      - trigger: state
        entity_id: input_boolean.in_bed_dummy_switch
        to: 'on'
        for:
          minutes: 1
        id: lock_on

      # - trigger: state
      #   entity_id: lock.building
      #   to: unlocked
      #   id: lock_off_building

      - trigger: mqtt
        topic: nuki/opener/trigger
        payload: button
        id: lock_off_building

    conditions:
      - condition: template
        value_template: >-
          {{
              trigger.from_state != None
            }}

    mode: restart
    actions:
      - choose:
        - conditions:
          - condition: trigger
            id:
              - lock_on_door
          - condition: state
            entity_id: lock.door
            state: unlocked
          - condition: state
            entity_id: input_boolean.auto_lock
            state: 'on'
          sequence:
            - action: lock.lock
              target:
                entity_id: lock.door

        - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id:
                  - lock_on
              - condition: and
                conditions:
                  - condition: trigger
                    id:
                      - lock_on_building
                  - condition: state
                    entity_id:
                      - device_tracker.root
                    state: not_home
          - condition: state
            entity_id: lock.door
            state: unlocked
          sequence:
            - if:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: binary_sensor.door
                    state: 'off'
                  - condition: state
                    entity_id: input_boolean.lock_skip
                    state: 'off'
              then:
                - action: lock.lock
                  target:
                    entity_id: lock.door
              else:
                - if:
                  - condition: state
                    entity_id: binary_sensor.door
                    state: 'on'
                  then:
                    - action: notify.send_message
                      target:
                        entity_id: notify.gmail_sms
                      data:
                        title: front door
                        message: door is open
                - if:
                  - condition: state
                    entity_id: input_boolean.lock_skip
                    state: 'on'
                  then:
                    - action: notify.send_message
                      target:
                        entity_id: notify.gmail_sms
                      data:
                        title: front door
                        message: lock skip is on

      - choose:
        - conditions:
          - condition: trigger
            id:
              - lock_on
          - condition: state
            entity_id: lock.building
            state: unlocked
          sequence:
            - action: lock.lock
              target:
                entity_id: lock.building

        - conditions:
          - condition: trigger
            id:
              - lock_off
          - condition: state
            entity_id: lock.building
            state: locked
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.doors_full_unlock

      - choose:
        - conditions:
          - condition: trigger
            id:
              - lock_off_building
          - condition: state
            entity_id: lock.door
            state: locked
          sequence:
            - wait_template: >-
                {{
                    is_state('lock.building', 'unlocked')
                  }}
              timeout:
                seconds: 40
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: >-
                    {{
                        wait.completed
                      }}
              then:
                - action: lock.unlock
                  target:
                    entity_id: lock.door
              else:
                - action: notify.send_message
                  target:
                    entity_id: notify.gmail_sms
                  data:
                    title: door
                    message: building unlock timeout

  - alias: ring_notify
    id: ring_notify
    triggers:
      - trigger: state
        entity_id: binary_sensor.ring
        to: 'on'
    mode: single
    max_exceeded: silent
    actions:
      - action: script.all_notify
        data:
          icon_notify: door
          tit: ring
          msg: door
      - delay:
          seconds: 60

  - alias: disable_continuous_mode
    id: disable_continuous_mode
    triggers:
      - trigger: mqtt
        topic: nuki/opener/continuousMode
        payload: 'on'
    mode: single
    action:
      - delay:
          seconds: 60
      - service: mqtt.publish
        data:
          topic: nuki/opener/action
          payload: 'deactivateCM'
      - action: script.all_notify
        data:
          tit: 'nuki opener'
          msg: 'deactivateCM'


  - alias: skip_lock_update
    id: skip_lock_update
    trigger:
      - trigger: state
        entity_id:
          - input_boolean.away_skip
          - input_boolean.lock_skip
        for:
          seconds: 3
        id: notify

      - trigger: zone
        entity_id: device_tracker.root
        zone: zone.home
        event: enter
        id: disable_skip

    mode: queued
    max: 4

    actions:
      - choose:
        - conditions:
          - condition: trigger
            id:
              - notify
          sequence:
            - action: notify.send_message
              target:
                entity_id: notify.gmail_sms
              data:
                title: >
                  {{ state_attr(trigger.entity_id, 'friendly_name') }}
                message: >
                  {%- set _map = {
                    'on': 'enabled',
                    'off': 'disabled'
                  } -%}
                  is {{ _map[trigger.to_state.state] }}

      - choose:
        - conditions:
          - condition: trigger
            id:
              - disable_skip
          sequence:
            - if:
              - condition: state
                entity_id: input_boolean.away_skip
                state: 'on'
              then:
                - action: input_boolean.turn_off
                  entity_id: input_boolean.away_skip
            - if:
              - condition: state
                entity_id: input_boolean.lock_skip
                state: 'on'
              then:
                - action: input_boolean.turn_off
                  entity_id: input_boolean.lock_skip
